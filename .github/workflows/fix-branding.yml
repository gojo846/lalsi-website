name: Fix Lalsi Web Tech Branding

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace Tanish branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('TANISH WEB TECH', 'LALSI WEB TECH')
          s = s.replace('Tanish Web Tech', 'Lalsi Web Tech')
          s = s.replace('Tanish Web Tech Shine', 'Lalsi Web Tech Shine')
          s = s.replace('TANISH SHINING TITLE', 'LALSI SHINING TITLE')
          s = s.replace('tanishRainbow', 'lalsiRainbow')
          s = s.replace('tanishGlow', 'lalsiGlow')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit branding fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Change branding to Lalsi Web Tech'
          git push
