name: Tanish Web Tech Shine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add colorful shining title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* TANISH SHINING TITLE */'
          if marker not in s:
              css = '''\n/* TANISH SHINING TITLE */\n.head h1{background:linear-gradient(90deg,#ff1744,#ffea00,#00e5ff,#7c4dff,#ff1493,#00e676,#ff1744);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;text-shadow:0 0 8px rgba(255,255,255,.25);animation:tanishRainbow 4s linear infinite, tanishGlow 1.8s ease-in-out infinite alternate;position:relative;z-index:2}\n@keyframes tanishRainbow{0%{background-position:0% center}100%{background-position:300% center}}\n@keyframes tanishGlow{0%{filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}100%{filter:drop-shadow(0 0 14px rgba(0,229,255,.95)) drop-shadow(0 0 20px rgba(255,23,68,.65))}}\n''' 
              s = s.replace('</style>', css + '</style>', 1)
              s = s.replace('LALSI WEB TECH', 'TANISH WEB TECH')
              s = s.replace('Lalsi Web Tech', 'Tanish Web Tech')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make Tanish Web Tech colorful and shining'
          git push
